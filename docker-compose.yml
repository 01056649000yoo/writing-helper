# [2026-07-30] 프로젝트 이름 고정 — -p 를 빼먹어도 다른 스택을 잡지 않게 한다.
name: writing-helper

services:
  writing-helper:
    container_name: writing-helper-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-local}
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SUPABASE_INTERNAL_URL: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    restart: unless-stopped