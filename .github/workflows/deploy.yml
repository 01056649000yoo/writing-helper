name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Copy .env.local from host
        run: cp /Users/seunghyeonmaegmini/writing-helper/.env.local .

      - name: Set BUILD_VERSION
        run: echo "BUILD_VERSION=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Stop legacy launchctl / pm2 processes (no-op if absent)
        run: |
          launchctl bootout "gui/$(id -u)/com.jarvis.helper" >/dev/null 2>&1 || true
          launchctl disable "gui/$(id -u)/com.jarvis.helper" >/dev/null 2>&1 || true
          if [ -x "node_modules/.bin/pm2" ]; then
            ./node_modules/.bin/pm2 delete writing-helper >/dev/null 2>&1 || true
            ./node_modules/.bin/pm2 save --force >/dev/null 2>&1 || true
            ./node_modules/.bin/pm2 kill >/dev/null 2>&1 || true
          fi
          pkill -f "npm run start" >/dev/null 2>&1 || true
          pkill -f "next-server" >/dev/null 2>&1 || true
          true

      - name: Build docker image
        run: docker compose build --no-cache

      - name: Restart docker stack
        run: docker compose up -d --remove-orphans

      - name: Verify container
        run: |
          sleep 5
          docker ps --filter "name=writing-helper-app" --format "{{.Status}}"
          docker exec writing-helper-app sh -c 'env | grep NEXT_PUBLIC_BUILD_VERSION'
