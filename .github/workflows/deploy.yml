name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      RUNTIME_ENV_FILE: /Users/seunghyeonmaegmini/writing-helper/.env.local
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Isolate npm cache
        run: echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"

      - name: Set BUILD_VERSION
        run: echo "BUILD_VERSION=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run lint

      - name: Build docker image
        run: docker compose --env-file "$RUNTIME_ENV_FILE" build --no-cache

      - name: Restart docker stack
        run: docker compose --env-file "$RUNTIME_ENV_FILE" up -d --remove-orphans

      - name: Verify deployment
        run: |
          docker ps --filter "name=writing-helper-app" --format "{{.Status}}"
          docker exec writing-helper-app sh -c 'env | grep NEXT_PUBLIC_BUILD_VERSION'
          curl --fail --silent --show-error --retry 12 --retry-delay 2 http://127.0.0.1:3000/login >/dev/null
