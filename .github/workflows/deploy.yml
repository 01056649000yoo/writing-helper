name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      RUNTIME_ENV_FILE: /Users/seunghyeonmaegmini/writing-helper/.env.local
      INTEGRATED_ENV_FILE: /Users/seunghyeonmaegmini/agit-supabase/.env
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Isolate npm cache
        run: echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"

      - name: Set BUILD_VERSION
        run: echo "BUILD_VERSION=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run lint && npm test

      - name: Build docker image
        run: docker compose --env-file "$RUNTIME_ENV_FILE" build

      - name: Build integrated lab image
        run: docker compose --env-file "$INTEGRATED_ENV_FILE" -f docker-compose.lab.yml build

      - name: Restart docker stack
        run: docker compose --env-file "$RUNTIME_ENV_FILE" up -d --remove-orphans

      - name: Restart integrated lab stack
        run: docker compose --env-file "$INTEGRATED_ENV_FILE" -f docker-compose.lab.yml up -d --remove-orphans

      - name: Verify deployment
        run: |
          docker ps --filter "name=writing-helper-app" --format "{{.Status}}"
          docker exec writing-helper-app sh -c 'env | grep NEXT_PUBLIC_BUILD_VERSION'
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Verify integrated lab deployment
        run: |
          docker ps --filter "name=writing-helper-lab-app" --format "{{.Status}}"
          docker exec writing-helper-lab-app printenv NEXT_PUBLIC_BASE_PATH
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3001/lab/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
